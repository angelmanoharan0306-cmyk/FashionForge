<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FashionForge — Atelier Account & Sign In</title>
  <meta name="description" content="Sign in or register for your FashionForge atelier account to persist bespoke fashion designs and access your couture portfolio.">

  <!-- Google Fonts: Playfair Display + Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✂️</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/auth.js"></script>
</head>
<body class="studio-app-body auth-page-body">

  <!-- Global Toast Notification Container -->
  <div class="studio-toast-container" id="toast-container" aria-live="polite"></div>

  <!-- Top Navigation Header -->
  <header class="studio-top-header" role="banner" aria-label="FashionForge header">
    <div class="header-left">
      <a class="brand-logo" href="index.html" aria-label="FashionForge Home">
        <span class="logo-mark" aria-hidden="true">✂</span>
        <span class="logo-text">Fashion<span>Forge</span></span>
      </a>
      <span class="studio-badge">Atelier Portal</span>
    </div>
    <div class="header-right">
      <a class="btn-ghost" href="design.html" title="Return to Design Studio">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>Design Studio</span>
      </a>
      <a class="btn-ghost" href="my-designs.html" title="View Portfolio">
        <span>My Designs</span>
      </a>
    </div>
  </header>

  <!-- Auth Main Container -->
  <main class="auth-main-wrap" role="main">
    <div class="auth-card-container">
      
      <!-- Brand Header -->
      <div class="auth-card-header">
        <span class="auth-pretitle">The Bespoke Workspace</span>
        <h1 class="auth-title" id="auth-title">Welcome to FashionForge</h1>
        <p class="auth-subtitle" id="auth-subtitle">Sign in to save bespoke garments, manage your portfolio, and access couture flats.</p>
      </div>

      <!-- Tab Switcher -->
      <div class="auth-tabs" role="tablist" aria-label="Authentication modes">
        <button class="auth-tab-btn is-active" id="tab-login" type="button" role="tab" aria-selected="true" aria-controls="form-login">
          Sign In
        </button>
        <button class="auth-tab-btn" id="tab-register" type="button" role="tab" aria-selected="false" aria-controls="form-register">
          Create Account
        </button>
      </div>

      <!-- Error / Alert Banner -->
      <div class="auth-alert-banner" id="auth-alert-banner" style="display: none;" role="alert">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span id="auth-alert-message">Error message</span>
      </div>

      <!-- LOGIN FORM -->
      <form class="auth-form" id="form-login" role="tabpanel" aria-labelledby="tab-login">
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <input class="form-input" id="login-email" type="email" placeholder="couturier@fashionforge.atelier" required autocomplete="email">
        </div>

        <div class="form-group">
          <div class="form-label-row">
            <label class="form-label" for="login-password">Password</label>
          </div>
          <input class="form-input" id="login-password" type="password" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button class="btn-primary auth-submit-btn" id="btn-submit-login" type="submit">
          <span>Sign In to Atelier</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>

      <!-- REGISTER FORM -->
      <form class="auth-form" id="form-register" style="display: none;" role="tabpanel" aria-labelledby="tab-register">
        <div class="form-group">
          <label class="form-label" for="register-name">Artisan / Designer Name</label>
          <input class="form-input" id="register-name" type="text" placeholder="Madame Grès" required autocomplete="name">
        </div>

        <div class="form-group">
          <label class="form-label" for="register-email">Email Address</label>
          <input class="form-input" id="register-email" type="email" placeholder="designer@fashionforge.atelier" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="register-password">Password (min. 6 characters)</label>
          <input class="form-input" id="register-password" type="password" placeholder="••••••••" required minlength="6" autocomplete="new-password">
        </div>

        <div class="form-group">
          <label class="form-label" for="register-confirm-password">Confirm Password</label>
          <input class="form-input" id="register-confirm-password" type="password" placeholder="••••••••" required minlength="6" autocomplete="new-password">
        </div>

        <button class="btn-primary auth-submit-btn" id="btn-submit-register" type="submit">
          <span>Create Atelier Account</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </button>
      </form>

      <!-- Footer Note -->
      <div class="auth-card-footer">
        <p>Bespoke fashion studio powered by 2.5D geometric projection & centralized atelier pricing.</p>
      </div>

    </div>
  </main>

</body>
</html>
