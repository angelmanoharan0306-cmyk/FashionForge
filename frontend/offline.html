<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — FashionForge</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✂️</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .offline-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-8);
      background: radial-gradient(ellipse at 50% 30%, #f7ece5 0%, #fbf9f6 70%);
      text-align: center;
    }
    .offline-card {
      background: #ffffff;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: var(--space-10) var(--space-8);
      max-width: 520px;
      width: 100%;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.05);
    }
    .offline-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--color-brand-tint);
      color: var(--color-brand);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: var(--space-6);
    }
    .offline-title {
      font-family: var(--font-serif);
      font-size: 1.85rem;
      font-weight: 700;
      color: var(--color-text-primary);
      margin: 0 0 var(--space-3);
    }
    .offline-desc {
      font-size: var(--text-sm);
      color: var(--color-text-secondary);
      line-height: 1.6;
      margin: 0 0 var(--space-6);
    }
    .offline-actions {
      display: flex;
      gap: var(--space-3);
      justify-content: center;
    }
  </style>
</head>
<body class="app-page-body">

  <main class="offline-wrap" role="main">
    <div class="offline-card">
      <div class="offline-icon" aria-hidden="true">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
      </div>

      <span class="studio-badge" style="margin-bottom: var(--space-3); display: inline-block;">Network Disconnected</span>
      <h1 class="offline-title">Offline Mode</h1>
      <p class="offline-desc">
        Your device is currently disconnected from the internet. The FashionForge application shell is loaded, but saved designs, shopping bags, and order tracking require an active connection.
      </p>

      <div class="offline-actions">
        <button class="btn-primary" onclick="window.location.reload();" type="button">
          <span>Retry Connection</span>
        </button>
        <a class="btn-secondary" href="design.html">
          <span>Local Studio</span>
        </a>
      </div>
    </div>
  </main>

</body>
</html>
