<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="ffBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b96b61" />
      <stop offset="100%" stop-color="#783733" />
    </linearGradient>
    <linearGradient id="ffGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7" />
      <stop offset="100%" stop-color="#e8cfbd" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#ffBg)" />

  <!-- Subtle atelier frame -->
  <rect x="36" y="36" width="440" height="440" rx="90" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="3" stroke-dasharray="10 8" />

  <!-- Central Shears & Monogram Emblem -->
  <g filter="url(#shadow)" transform="translate(256, 256)">
    <!-- Shears / Atelier Emblem -->
    <path d="M-60 -110 C-100 -50, -100 20, -50 80 C-20 120, -10 130, -35 155 C-55 175, -55 200, -35 215 C-15 230, 15 220, 25 195 C35 170, 0 145, 0 145 C0 145, 30 110, 50 70 C90 10, 80 -60, 40 -110 Z" fill="none" stroke="url(#ffGold)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Crossed Atelier Needle & Scissors Motif -->
    <line x1="-120" y1="120" x2="120" y2="-120" stroke="url(#ffGold)" stroke-width="16" stroke-linecap="round" />
    <circle cx="-135" cy="135" r="28" fill="none" stroke="url(#ffGold)" stroke-width="14" />
    
    <line x1="120" y1="120" x2="-120" y2="-120" stroke="url(#ffGold)" stroke-width="16" stroke-linecap="round" />
    <circle cx="135" cy="135" r="28" fill="none" stroke="url(#ffGold)" stroke-width="14" />

    <!-- Center Pivot Gem -->
    <circle cx="0" cy="0" r="18" fill="url(#ffGold)" />
    <circle cx="0" cy="0" r="9" fill="#783733" />
  </g>

  <!-- FashionForge Wordmark Initials -->
  <text x="256" y="440" font-family="'Playfair Display', Georgia, serif" font-size="54" font-weight="700" letter-spacing="8" fill="#ffffff" text-anchor="middle" opacity="0.95">FASHIONFORGE</text>
</svg>
